name: Deploy Backend to Local Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Backend
        run: |
          echo "🚀 Начинаем процесс деплоя..."
          
          # 1. Переходим в папку с проектом
          cd /home/user/Programming/RecipeApp/recipes-app
          
          # 2. Сбрасываем локальные изменения и подтягиваем свежие из ветки master
          git fetch --all
          git reset --hard origin/master
          
          # 3. Пересобираем и перезапускаем Docker-контейнеры
          echo "🔄 Перезапуск Docker-контейнеров бэкенда..."
          docker compose down
          
          docker compose up -d --build --wait --wait-timeout 120
          
          echo "✅ Деплой бэкенда успешно завершен!"

      # 👇 НОВЫЙ ШАГ: Если предыдущий шаг упал, выводим логи прямо в GitHub
      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Деплой не удался! Выводим последние 100 строк логов контейнера:"
          cd /home/user/Programming/RecipeApp/recipes-app
          docker compose logs --tail=100 recipe-backend