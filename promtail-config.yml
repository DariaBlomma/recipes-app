server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# Отправляем логи в ЛОКАЛЬНЫЙ Loki (без авторизации!)
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: recipe-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: recipe-backend
          env: prod
          # Откуда читаем логи (берем путь из .env)
          __path__: ${LOG_PATH}/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: traceId
            spanId: spanId
            message: message
            logger_name: logger_name
      - labels:
          level:
          traceId: