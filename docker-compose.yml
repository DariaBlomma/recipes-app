services:
  postgres:
    image: postgres:15
    container_name: recipe-postgres
    environment:
      POSTGRES_USER: recipeuser
      POSTGRES_PASSWORD: recipepass
      POSTGRES_DB: recipedb
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_${SPRING_PROFILES_ACTIVE:-prod}_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recipe-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - backend-logs:${LOG_PATH}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: recipe-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: recipe-promtail
    volumes:
      - backend-logs:${LOG_PATH}:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - loki

  grafana:
    image: grafana/grafana:10.4.0
    container_name: recipe-grafana
    env_file:
      - .env
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: recipe-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - grafana
    restart: unless-stopped

volumes:
  postgres_prod_data:
  postgres_dev_data:
  backend-logs:
  loki-data:
  grafana-data: